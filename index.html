<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>工程圖學考點網</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a drafting sheet — title-block header, ruled folders, a gridded canvas for keywords. */
:root{
  --paper:#EEF1EE; --sheet:#FBFCFA; --sheet2:#F3F5F2; --ink:#1B2227; --ink2:#5A666E; --rule:#C9D1D2; --grid:#DCE3E2;
  --blue:#1F58A6; --blue-soft:#E3ECF8; --red:#C2362B; --red-soft:#F8E4E1; --green:#2C7A4B; --green-soft:#E1F1E7; --amber:#A86A12; --amber-soft:#F7EBD5;
  --g-A:#1F58A6; --g-B:#7A4FB0; --g-C:#0F7C80; --g-D:#B0482D; --g-E:#5E7A12;
  --shadow:0 1px 0 rgba(20,30,40,.06),0 6px 18px -10px rgba(20,30,40,.25);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101519; --sheet:#171E23; --sheet2:#1D252B; --ink:#E2E8EA; --ink2:#97A4AB; --rule:#2F3A41; --grid:#232D33;
  --blue:#78A9EA; --blue-soft:#1C2D44; --red:#EE7B70; --red-soft:#3A2220; --green:#6CC38E; --green-soft:#1A3326; --amber:#E2A74E; --amber-soft:#3A2D16;
  --g-A:#78A9EA; --g-B:#B497E0; --g-C:#5CC4C7; --g-D:#EB8C6E; --g-E:#A9C65A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#101519; --sheet:#171E23; --sheet2:#1D252B; --ink:#E2E8EA; --ink2:#97A4AB; --rule:#2F3A41; --grid:#232D33;
  --blue:#78A9EA; --blue-soft:#1C2D44; --red:#EE7B70; --red-soft:#3A2220; --green:#6CC38E; --green-soft:#1A3326; --amber:#E2A74E; --amber-soft:#3A2D16;
  --g-A:#78A9EA; --g-B:#B497E0; --g-C:#5CC4C7; --g-D:#EB8C6E; --g-E:#A9C65A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}

/* Title block header */
.tb{display:grid;grid-template-columns:auto 1fr auto;border:1.5px solid var(--ink);background:var(--sheet);margin-bottom:18px}
.tb>div{padding:8px 12px;border-right:1px solid var(--ink);min-width:0}
.tb>div:last-child{border-right:0}
.tb .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;display:block;line-height:1.2}
.tb .course{font-family:var(--f-num);font-weight:700;font-size:20px;letter-spacing:.02em}
.tb .name{font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb .exam{text-align:right}
.tb .exam b{font-family:var(--f-num);font-size:20px;font-weight:700;color:var(--red)}
.tb .exam small{color:var(--ink2);font-size:12px;display:block;line-height:1.3}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:-6px 0 14px}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.backbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:3px 10px;color:var(--ink)!important;text-decoration:none!important}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--ink2);margin-top:2px}
@media (max-width:640px){.tb{grid-template-columns:1fr auto}.tb>div:first-child{display:none}.tb .name{font-size:16px}}

/* Section heads */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.sh h2{font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.sh h2 .no{font-family:var(--f-mono);font-size:12px;color:var(--ink2);font-weight:400;letter-spacing:.06em}
.sh .note{font-size:12.5px;color:var(--ink2)}

/* Home: keyword entrance */
.kwentry{display:grid;grid-template-columns:1.2fr 1fr;border:1.5px solid var(--ink);background:var(--sheet);text-align:left;padding:0;width:100%;overflow:hidden}
.kwentry .t{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kwentry .t h3{font-size:22px}
.kwentry .t p{margin:0;color:var(--ink2);font-size:13.5px}
.kwentry .go{margin-top:6px;font-weight:700;color:var(--blue)}
.kwentry .pv{position:relative;border-left:1px solid var(--rule);background-color:var(--sheet2);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;min-height:130px}
.kwentry .pv span{position:absolute;font-size:13px;padding:2px 8px;border:1px solid var(--rule);background:var(--sheet);border-radius:3px;white-space:nowrap}
.kwentry:hover{box-shadow:var(--shadow)}
@media (max-width:640px){.kwentry{grid-template-columns:1fr}.kwentry .pv{border-left:0;border-top:1px solid var(--rule);min-height:90px}}

/* Folder cards */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.fcard{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:2px 10px 2px 2px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fcard::before{content:"";position:absolute;left:-1px;top:-9px;width:42%;height:9px;background:var(--sheet);border:1px solid var(--rule);border-bottom:0;border-radius:6px 6px 0 0}
.fcard:hover{box-shadow:var(--shadow);border-color:var(--ink2)}
.fcard .code{font-family:var(--f-num);font-weight:700;font-size:28px;line-height:1;color:var(--gc)}
.fcard .nm{font-weight:700;font-size:17px}
.fcard .lec{font-family:var(--f-mono);font-size:11.5px;color:var(--ink2)}
.fcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.bar{height:5px;background:var(--grid);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gc,var(--blue))}
.stars{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--amber);letter-spacing:.02em;white-space:nowrap}
.mk{display:inline-flex;gap:6px;font-family:var(--f-mono);font-size:11px}
.mk span{padding:0 5px;border-radius:3px}
.mk .m{background:var(--green-soft);color:var(--green)}.mk .r{background:var(--amber-soft);color:var(--amber)}.mk .w{background:var(--red-soft);color:var(--red)}

/* Folder view */
.fhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:12px}
.fhead .code{font-family:var(--f-num);font-weight:700;font-size:48px;line-height:.9;color:var(--gc)}
.fhead h1{font-size:24px}
.fhead .lec{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.mastery{display:grid;grid-template-columns:auto repeat(3,1fr);gap:0;border:1px solid var(--rule);background:var(--sheet);margin-top:16px}
.mastery .lab{padding:12px 14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.mastery .lab b{font-size:14.5px}
.mastery .lab small{color:var(--ink2);font-size:12px}
.mtile{border:0;border-right:1px solid var(--rule);background:none;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.mtile:last-child{border-right:0}
.mtile:hover{background:var(--sheet2)}
.mtile .n{font-family:var(--f-num);font-size:28px;font-weight:700;line-height:1}
.mtile .t{font-size:13px;font-weight:500}
.mtile .s{font-size:11.5px;color:var(--ink2)}
.mtile.m .n{color:var(--green)}.mtile.r .n{color:var(--amber)}.mtile.w .n{color:var(--red)}
@media (max-width:640px){.mastery{grid-template-columns:repeat(3,1fr)}.mastery .lab{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--rule)}}
.subs{display:flex;flex-direction:column;border:1px solid var(--rule);background:var(--sheet)}
.srow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;width:100%}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--sheet2)}
.srow .ix{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.srow .tt{font-weight:500;font-size:15px;min-width:0}
.srow .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
.srow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lv{font-size:11px;padding:0 6px;border:1px solid var(--rule);border-radius:3px;color:var(--ink2)}
.st{font-size:11.5px;font-family:var(--f-mono);padding:1px 7px;border-radius:10px;white-space:nowrap}
.st.un{background:var(--sheet2);color:var(--ink2);border:1px solid var(--rule)}
.st.ing{background:var(--blue-soft);color:var(--blue)}
.st.ok{background:var(--green-soft);color:var(--green)}
.sortnote{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}

/* Sub view */
.subhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:12px}
.subhead h1{font-size:22px}
.subhead .k{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:6px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.btn.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.btn.ai{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:0;margin:16px 0 14px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2.5px solid transparent;padding:8px 14px;font-size:14.5px;color:var(--ink2);white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.tab .c{font-family:var(--f-mono);font-size:11px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}

/* Flashcards */
.fc-wrap{display:flex;flex-direction:column;gap:12px;max-width:720px}
.fc{perspective:1200px;border:0;background:none;padding:0;width:100%;text-align:left}
.fc-in{position:relative;min-height:220px;transition:transform .45s ease;transform-style:preserve-3d;display:grid}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);padding:22px 24px 34px;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:var(--shadow)}
.fc-face.back{transform:rotateY(180deg);background:var(--sheet2)}
.fc-face .side{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.fc-face .q{font-size:19px;font-weight:700}
.fc-face .a{font-size:16px;line-height:1.75}
.fc-face .hint{position:absolute;bottom:10px;right:14px;font-size:11.5px;color:var(--ink2)}
.hot{display:inline-block;font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:3px;padding:0 5px;letter-spacing:.05em;vertical-align:middle}
.fc-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fc-count{font-family:var(--f-num);font-size:18px;font-weight:600}
.marks{display:flex;gap:8px;flex-wrap:wrap}
.markbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:6px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.markbtn .s{color:var(--amber);font-size:12px;letter-spacing:-1px}
.markbtn.m[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.markbtn.r[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.markbtn.w[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);background:var(--sheet);font-family:var(--f-mono);font-size:10px;display:grid;place-items:center;padding:0;color:var(--ink2)}
.dot.cur{border-color:var(--ink);color:var(--ink)}
.dot.m{background:var(--green);border-color:var(--green);color:var(--sheet)}
.dot.r{background:var(--amber);border-color:var(--amber);color:var(--sheet)}
.dot.w{background:var(--red);border-color:var(--red);color:var(--sheet)}
.dot.seen:not(.m):not(.r):not(.w){background:var(--grid)}

/* Example & quiz items */
.items{display:flex;flex-direction:column;gap:14px;max-width:820px}
.item{background:var(--sheet);border:1px solid var(--rule);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item .src{font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .q{font-weight:700;font-size:16px}
.ans{border-left:3px solid var(--blue);padding:8px 12px;background:var(--blue-soft);display:flex;flex-direction:column;gap:6px}
.ans .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--blue)}
.exp{border-left:3px solid var(--rule);padding:6px 12px;color:var(--ink);font-size:14.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:8px 12px;text-align:left;display:flex;gap:10px;align-items:baseline}
.opt .l{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.opt:hover:not(:disabled){border-color:var(--ink2)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.verdict{font-weight:700}
.verdict.ok{color:var(--green)}.verdict.no{color:var(--red)}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.score b{font-family:var(--f-num);font-size:22px;color:var(--ink)}
.fig{overflow-x:auto;background:var(--sheet2);border:1px solid var(--rule);padding:8px}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.empty{padding:26px;border:1px dashed var(--rule);color:var(--ink2);text-align:center;background:var(--sheet)}

/* Mastery cards grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{background:var(--sheet);border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mcard .from{font-family:var(--f-mono);font-size:11px;color:var(--ink2)}
.mcard .q{font-weight:700}
.mcard .a{font-size:14px;border-top:1px dashed var(--rule);padding-top:8px}
.mcard .marks .markbtn{padding:3px 8px;font-size:12px}

/* Chat */
.chat{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);min-height:0}
.chat .ctx{font-size:12px;color:var(--ink2);padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--sheet2)}
.chat .ctx summary{cursor:pointer}
.chat .ctx pre{white-space:pre-wrap;font-family:var(--f-body);font-size:12px;margin:6px 0 0;max-height:160px;overflow:auto}
.chat .log{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:160px}
.msg{max-width:90%;padding:8px 12px;border-radius:8px;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--blue);color:var(--sheet)}
.msg.a{align-self:flex-start;background:var(--sheet2);border:1px solid var(--rule)}
.msg.a p{margin:0 0 6px}.msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0;padding-left:20px}
.msg.sys{align-self:center;font-size:12.5px;color:var(--ink2);background:none;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:2px 10px;font-size:12.5px}
.chat form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--rule)}
.chat textarea{flex:1;resize:none;border:1px solid var(--rule);border-radius:var(--r);padding:7px 10px;font:inherit;font-size:14.5px;background:var(--paper);color:var(--ink);min-height:40px;max-height:120px}
.drawer{position:fixed;z-index:50;right:0;top:0;bottom:0;width:min(440px,100%);display:flex;flex-direction:column;background:var(--sheet);border-left:1.5px solid var(--ink);box-shadow:-10px 0 30px -12px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule)}
.drawer .dh b{font-size:15px}
.drawer .chat{flex:1;border:0}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:40}
@media (max-width:640px){.drawer{top:auto;height:82%;width:100%;border-left:0;border-top:1.5px solid var(--ink);border-radius:12px 12px 0 0}}
.inlinechat{height:480px}

/* Keyword studio */
.kw{display:flex;flex-direction:column;gap:0;height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:520px;border:1.5px solid var(--ink);background:var(--sheet)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.tools .sep{width:1px;height:22px;background:var(--rule);margin:0 4px}
.tool{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:4px 10px;font-size:13px}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--rule);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.wd{width:28px;height:24px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);display:grid;place-items:center;padding:0}
.wd i{display:block;width:14px;background:var(--ink);border-radius:2px}
.wd[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.board{position:relative;flex:1 1 56%;min-height:220px;overflow:hidden;background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;touch-action:none}
.board canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.board.draw canvas{pointer-events:auto;cursor:crosshair}
.board .hintb{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:14px;pointer-events:none;text-align:center;padding:16px}
.kchip{position:absolute;z-index:2;left:0;top:0;transform-origin:center;padding:4px 12px 4px 10px;background:var(--sheet);border:1.5px solid var(--gc);border-left-width:5px;border-radius:3px;font-weight:700;font-size:16px;white-space:nowrap;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:var(--shadow)}
.kchip.sel{outline:2px dashed var(--blue);outline-offset:3px}
.kchip .hd{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;border-radius:50%;background:var(--blue);border:2px solid var(--sheet);cursor:nwse-resize;display:none;touch-action:none}
.kchip.sel .hd{display:block}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;border-top:1px solid var(--rule);background:var(--sheet2);font-size:13.5px;min-height:44px}
.selbar .def{flex:1 1 200px;min-width:0}
.selbar .def b{margin-right:8px}
.kwlist{flex:1 1 44%;overflow-y:auto;border-top:1.5px solid var(--ink);background:var(--sheet2);-webkit-overflow-scrolling:touch}
.kwg{padding:0 12px 12px}
.kwg h3{position:sticky;top:0;z-index:1;background:var(--sheet2);font-size:13.5px;padding:10px 0 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.kwg h3 i{width:10px;height:10px;border-radius:2px;background:var(--gc)}
.kwg h3 small{font-weight:400;color:var(--ink2);font-family:var(--f-mono);font-size:11px}
.kwgrid{display:flex;flex-wrap:wrap;gap:6px}
.kwb{border:1px solid var(--rule);border-left:3px solid var(--gc);background:var(--sheet);border-radius:3px;padding:3px 10px;font-size:13.5px;text-align:left}
.kwb:hover{border-color:var(--gc)}
.kwb.on{background:var(--blue-soft)}
.kwb.on::after{content:" ●";color:var(--blue);font-size:9px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:7px 14px;border-radius:6px;font-size:13px;z-index:60}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}}

// ===== 學習進度狀態（本機 + 帳號同步）=====
const LS_KEY = 'ed1106-progress-v1', LS_BOARD = 'ed1106-board-v1';
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let S = Object.assign({t:0, marks:{}, seen:{}, quiz:{}, done:{}}, lsGet(LS_KEY) || {});
let BOARD = Object.assign({t:0, chips:[], strokes:[]}, lsGet(LS_BOARD) || {});
let remote = null, syncTimer = null, boardTimer = null, syncLabel = '進度存於此瀏覽器';
function touch(){ S.t = Date.now(); lsSet(LS_KEY, S); queueSync(); }
function touchBoard(){ BOARD.t = Date.now(); lsSet(LS_BOARD, BOARD); queueBoardSync(); }
function queueSync(){ if(!remote) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => remote.prog.set({json: JSON.stringify(S), t: S.t}).catch(()=>{}), 1500); }
function queueBoardSync(){ if(!remote) return; clearTimeout(boardTimer); boardTimer = setTimeout(() => { const j = JSON.stringify(BOARD); if(j.length < 240000) remote.board.set({json: j, t: BOARD.t}).catch(()=>{}); }, 2500); }
async function initSync(){
  if(!window.claude || !window.claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const base = 'data/users/' + uid + '/';
    remote = {prog: db.doc(base + 'progress'), board: db.doc(base + 'board')};
    const [p, b] = await Promise.all([remote.prog.get(), remote.board.get()]);
    let changed = false;
    if(p.exists){ const d = p.data(); if(d && d.t > S.t){ try{ S = Object.assign({marks:{},seen:{},quiz:{},done:{}}, JSON.parse(d.json)); lsSet(LS_KEY, S); changed = true; }catch(e){} } }
    else if(S.t) queueSync();
    if(b.exists){ const d = b.data(); if(d && d.t > BOARD.t){ try{ BOARD = Object.assign({chips:[],strokes:[]}, JSON.parse(d.json)); lsSet(LS_BOARD, BOARD); changed = true; }catch(e){} } }
    else if(BOARD.t) queueBoardSync();
    syncLabel = '進度已同步到你的帳號';
    renderHeader();
    if(changed) render();
  }catch(e){ /* 保持本機模式 */ }
}

function subStats(s){
  const c = {m:0, r:0, w:0}; let stars = 0, seen = 0;
  s.cards.forEach((_, i) => { const k = S.marks[cid(s,i)]; if(k){ c[k]++; stars += STAR[k]; } if(S.seen[cid(s,i)]) seen++; });
  s.examples.forEach((_, i) => { if(S.seen[xid(s,i)]) seen++; });
  s.quiz.forEach((_, i) => { if(S.quiz[qid(s,i)]) seen++; });
  const total = s.cards.length + s.examples.length + s.quiz.length;
  const pct = S.done[s.id] ? 100 : Math.round(seen / total * 100);
  return {c, stars, pct, marked: c.m + c.r + c.w};
}
function folderStats(f){
  const o = {c:{m:0,r:0,w:0}, stars:0, pct:0, marked:0};
  f.subs.forEach(s => { const t = subStats(s); o.stars += t.stars; o.marked += t.marked; o.pct += t.pct; ['m','r','w'].forEach(k => o.c[k] += t.c[k]); });
  o.pct = Math.round(o.pct / f.subs.length); return o;
}
function sortedSubs(f){
  const st = f.subs.map(s => ({s, t: subStats(s)}));
  const any = st.some(x => x.t.marked > 0);
  if(any) st.sort((a, b) => (b.t.stars - a.t.stars) || (a.s.order - b.s.order));
  return {list: st, byStars: any};
}
const statusPill = p => p >= 100 ? '<span class="st ok">✓ 已讀</span>' : p > 0 ? `<span class="st ing">學習中 ${p}%</span>` : '<span class="st un">未讀</span>';

const mkTxt = c => `<span class="mk"><span class="m">精 ${c.m}</span><span class="r">複 ${c.r}</span><span class="w">加 ${c.w}</span></span>`;

function genFromBank(f, k){
  const subs = [...new Set(cardsWithMark(f, k).map(x => x.s.id))].map(id => SUB[id]);
  const pool = []; subs.forEach(s => s.quiz.forEach((q, i) => pool.push({...q, id: 'g-'+qid(s,i)+'-'+Date.now(), from: s.title, ctx: s.title})));
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

async function genFromAI(f, k){
  const out = $('#genout');
  const sample = await getSample();
  if(!sample){ out.innerHTML = `<div class="empty">${AI_OFF}</div>`; return; }
  out.innerHTML = '<div class="empty">AI 正在出題…（約 10～40 秒）</div>';
  const prompt = `你是工程圖學（BME 1106）助教。根據下列學生需要${LBL[k]}的觀念，出 4 題繁體中文四選一選擇題，強調考試重點、能分辨易混淆觀念，不要與觀念原句一模一樣。\n只回覆 JSON 陣列，格式：[{"q":"題目","o":["選項1","選項2","選項3","選項4"],"a":正確選項索引0-3,"e":"解說(1-2句)"}]\n\n${masteryContext(f, k)}`;
  try{
    const arr = await sample.json(prompt, {cache:false});
    const qs = (Array.isArray(arr) ? arr : []).filter(q => q && q.q && Array.isArray(q.o) && q.o.length >= 2 && Number.isInteger(Number(q.a))).slice(0, 6)
      .map((q, i) => ({q: String(q.q), o: q.o.map(String).slice(0, 4), a: Math.min(Number(q.a), 3), e: String(q.e || ''), id: 'ai-'+Date.now()+'-'+i, from: 'AI 新題', ctx: f.name}));
    if(!qs.length) throw {code:'invalid_json'};
    out._ans = {}; renderQuiz(out, qs, {persist:false});
  }catch(e){ out.innerHTML = `<div class="empty">${errText(e)}<br><button class="btn" data-act="genai" style="margin-top:10px">再試一次</button></div>`; }
}

// ===== AI 對話 =====
const AI_OFF = 'AI 問答需要在 Claude 中開啟此頁面才能使用。其他功能（抽認卡、測驗、畫布）都可正常使用。';
let samplePromise = null;
function getSample(){ if(!samplePromise) samplePromise = (window.claude && window.claude.use) ? claude.use('sample').catch(() => null) : Promise.resolve(null); return samplePromise; }
function errText(e){
  const c = e && e.code;
  if(c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled') return 'AI 問答目前無法使用（未授權或已停用）。';
  if(c === 'rate_limited') return '使用太頻繁了，請稍候再試。';
  if(c === 'session_expired') return '登入已過期，請重新登入 Claude。';
  if(c === 'invalid_json') return 'AI 回傳的格式無法解析。';
  if(c === 'refused') return 'AI 無法回答這個問題，換個問法試試。';
  return '連線中斷，請再試一次。';
}
function md(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let html = '', inList = false;
  lines.forEach(l => {
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(m){ if(!inList){ html += '<ul>'; inList = true; } html += '<li>' + m[1] + '</li>'; }
    else { if(inList){ html += '</ul>'; inList = false; } if(l.trim()) html += '<p>' + l.replace(/^#+\s*/, '') + '</p>'; }
  });
  if(inList) html += '</ul>';
  return html;
}
const CHATS = {};
function rulesFor(context){
  return `你是「工程圖學與電腦製圖（BME 1106，台大盧彥文老師）」的考前助教，學生正在準備 10/19 的 Exam 1。\n請用繁體中文回答，條理清楚，必要時條列，重要名詞可附英文。以下方講義內容為準；超出講義範圍時說明並以 CNS 工程製圖常識補充。回答精簡（約 150～300 字），除非學生要求更詳細。不要使用 Markdown 標題或表格語法以外的複雜格式。\n\n【學生目前在看的內容】\n${context}`;
}
function mountChat(el, cfg){
  const st = CHATS[cfg.key] = CHATS[cfg.key] || {turns: [], ctl: null};
  el.innerHTML = `<details class="ctx"><summary>AI 參考的內容</summary><pre>${esc(cfg.context)}</pre></details>
    <div class="log" aria-live="polite"></div>
    <div class="chips">${(cfg.chips || ['用更簡單的方式解釋','舉一個例子','考試會怎麼考？','常見的錯誤是什麼？']).map(c => `<button class="chip" type="button">${esc(c)}</button>`).join('')}</div>
    <form><textarea rows="1" placeholder="輸入你的問題…" aria-label="輸入問題" id="ta-${esc(cfg.key)}"></textarea><button class="btn pri" type="submit">送出</button></form>`;
  const log = $('.log', el), ta = $('textarea', el), form = $('form', el), sendBtn = $('button[type=submit]', el);
  const draw = () => {
    log.innerHTML = st.turns.length ? st.turns.map(t => `<div class="msg ${t.role === 'user' ? 'u' : t.err ? 'sys' : 'a'}">${t.role === 'user' ? esc(t.content) : t.err ? esc(t.content) : md(t.content)}</div>`).join('')
      : `<div class="msg sys">有什麼不懂的都可以問，例如「為什麼要這樣畫？」或「幫我出一題類似的」。</div>`;
    log.scrollTop = log.scrollHeight;
  };
  draw();
  const send = async (text) => {
    text = text.trim(); if(!text) return;
    if(st.ctl){ st.ctl.abort(); return; }
    st.turns.push({role:'user', content:text}); ta.value = ''; draw();
    const sample = await getSample();
    if(!sample){ st.turns.push({role:'assistant', content: AI_OFF, err:1}); draw(); return; }
    const bubble = document.createElement('div'); bubble.className = 'msg a'; bubble.textContent = '思考中…'; log.appendChild(bubble); log.scrollTop = log.scrollHeight;
    st.ctl = new AbortController(); sendBtn.textContent = '停止';
    const hist = st.turns.filter(t => !t.err).slice(-10);
    try{
      const {text: ans} = await sample([{role:'user', content: rulesFor(cfg.context)}, ...hist], {cache:false, signal: st.ctl.signal, onText: ({text}) => { bubble.innerHTML = md(text); log.scrollTop = log.scrollHeight; }});
      st.turns.push({role:'assistant', content: ans});
    }catch(e){
      if(e && e.text) st.turns.push({role:'assistant', content: e.text});
      if(!e || e.code !== 'cancelled') st.turns.push({role:'assistant', content: errText(e), err:1});
    }
    st.ctl = null; sendBtn.textContent = '送出'; draw();
  };
  form.addEventListener('submit', ev => { ev.preventDefault(); send(st.ctl ? ' ' : ta.value); });
  ta.addEventListener('keydown', ev => { if(ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing){ ev.preventDefault(); send(ta.value); } });
  $('.chips', el).addEventListener('click', ev => { const b = ev.target.closest('.chip'); if(b) send(b.textContent); });
  if(cfg.seed && !st.turns.length) ta.value = cfg.seed;
}
function openDrawer(title, cfg){
  closeDrawer();
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.id = 'scrim'; scrim.onclick = closeDrawer;
  const d = document.createElement('aside'); d.className = 'drawer'; d.id = 'drawer'; d.setAttribute('aria-label', 'AI 助教');
  d.innerHTML = `<div class="dh"><b>AI 助教 · ${esc(title)}</b><button class="btn" data-x>關閉</button></div><div class="chat"></div>`;
  document.body.append(scrim, d);
  $('[data-x]', d).onclick = closeDrawer;
  mountChat($('.chat', d), cfg);
  setTimeout(() => { const t = $('textarea', d); if(t) t.focus(); }, 50);
}

// ===== 示意圖 =====
const FIGS = {
  cool(){
    // [名稱, ᵛ 高度, ʰ 位置]；正值＝GL 上方
    const pts = [['a',1,-1],['b',1,.45],['c',-1,1],['d',-.5,-1],['e',1,0],['f',-.9,0],['g',0,-1],['i',0,1],['j',0,0]];
    const W = 560, H = 230, gy = 115, k = 80;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="COOL Time 點的投影圖"><line x1="20" y1="${gy}" x2="${W-10}" y2="${gy}" stroke="var(--g-B)" stroke-width="1.5"/><text x="22" y="${gy-6}" font-size="12" fill="var(--ink)">GL</text>`;
    pts.forEach(([nm, v, h], n) => {
      const x = 70 + n * 55, vy = gy - v * k, hy = gy - h * k, ys = [vy, hy, gy];
      s += `<line x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}" stroke="var(--blue)" stroke-width="1.2"/>`;
      const lab = (y, sup, below) => `<circle cx="${x}" cy="${y}" r="3" fill="var(--ink)"/><text x="${x+5}" y="${y + (below ? 16 : -5)}" font-size="14" fill="var(--red)">${nm}<tspan font-size="10" dy="-6">${sup}</tspan></text>`;
      // 標籤放在遠離另一點的一側
      const vBelow = v === h ? false : (vy > hy);
      const hBelow = v === h ? true : (hy > vy);
      s += lab(vy, 'v', vBelow) + lab(hy, 'h', hBelow);
    });
    return s + '</svg>';
  },
  lines(){
    const rows = [['A 粗實線','可見輪廓線','',3.2],['B 細實線','尺度線、剖面線','',1],['E 虛線','隱藏線','9 3',2],['F 細鏈線','中心線、假想線','40 4 2 4',1],['G 粗鏈線','特殊處理範圍','40 4 2 4',3.2]];
    let s = `<svg viewBox="0 0 520 ${rows.length*34+40}" width="520" role="img" aria-label="線條種類示意">`;
    rows.forEach((r, i) => { const y = 24 + i * 34; s += `<text x="8" y="${y+4}" font-size="13" fill="var(--ink)" font-weight="700">${r[0]}</text><line x1="110" y1="${y}" x2="330" y2="${y}" stroke="var(--ink)" stroke-width="${r[3]}" ${r[2] ? `stroke-dasharray="${r[2]}"` : ''}/><text x="345" y="${y+4}" font-size="12.5" fill="var(--ink2)">${r[1]}</text>`; });
    const y = 24 + rows.length * 34;
    s += `<text x="8" y="${y+4}" font-size="13" fill="var(--ink)" font-weight="700">H 割面線</text><line x1="110" y1="${y}" x2="128" y2="${y}" stroke="var(--ink)" stroke-width="3.2"/><line x1="134" y1="${y}" x2="306" y2="${y}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="40 4 2 4"/><line x1="312" y1="${y}" x2="330" y2="${y}" stroke="var(--ink)" stroke-width="3.2"/><text x="345" y="${y+4}" font-size="12.5" fill="var(--ink2)">兩端粗、中間細</text>`;
    return s + '</svg>';
  },
  angle(){
    const sym = (x, first) => {
      const cone = (cx) => `<path d="M${cx-30} 32 L${cx+30} 20 L${cx+30} 60 L${cx-30} 48 Z" fill="none" stroke="var(--ink)" stroke-width="2"/><line x1="${cx-38}" y1="40" x2="${cx+38}" y2="40" stroke="var(--ink2)" stroke-dasharray="10 3 2 3"/>`;
      const circ = (cx) => `<circle cx="${cx}" cy="40" r="20" fill="none" stroke="var(--ink)" stroke-width="2"/><circle cx="${cx}" cy="40" r="8" fill="none" stroke="var(--ink)" stroke-width="2"/><line x1="${cx-28}" y1="40" x2="${cx+28}" y2="40" stroke="var(--ink2)" stroke-dasharray="10 3 2 3"/><line x1="${cx}" y1="12" x2="${cx}" y2="68" stroke="var(--ink2)" stroke-dasharray="10 3 2 3"/>`;
      return (first ? cone(x) + circ(x + 90) : circ(x) + cone(x + 90)) + `<text x="${x+45}" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${first ? '第一角法' : '第三角法'}</text>`;
    };
    return `<svg viewBox="0 0 470 104" width="470" role="img" aria-label="第一角法與第三角法符號">${sym(50, true)}${sym(300, false)}</svg>`;
  }
};

// ===== 關鍵字畫布 =====
const PEN = {mode:'move', color:'#1B2227', width:3};
const COLORS = [['黑','#1B2227','#E8ECEE'],['藍','#1F58A6','#78A9EA'],['紅','#C2362B','#EE7B70'],['綠','#2C7A4B','#6CC38E']];
let sel = null, ro = null, clearArm = false;
const dark = () => { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); };
const penColor = c => { const r = COLORS.find(x => x[1] === c); return r ? (dark() ? r[2] : r[1]) : c; };
function kwHTML(){
  const onBoard = new Set(BOARD.chips.map(c => c.k));
  return `<div class="kw">
    <div class="tools" role="toolbar" aria-label="畫布工具">

      <button class="tool" data-tool="pen" aria-pressed="${PEN.mode==='pen'}">✎ 畫筆</button>
      <button class="tool" data-tool="erase" aria-pressed="${PEN.mode==='erase'}">⌫ 橡皮擦</button>
      <span class="sep"></span>
      ${COLORS.map(c => `<button class="sw" data-color="${c[1]}" aria-label="${c[0]}色" aria-pressed="${PEN.color===c[1]}" style="background:${c[1]}"></button>`).join('')}
      <span class="sep"></span>
      ${[2,4,8].map(w => `<button class="wd" data-width="${w}" aria-label="線寬 ${w}" aria-pressed="${PEN.width===w}"><i style="height:${Math.max(2,w/1.5)}px"></i></button>`).join('')}
      <span class="sep"></span>
      <button class="tool" data-tool="undo">↶ 復原</button>
      <button class="tool" data-tool="clear">清除畫布</button>
    </div>
    <div class="board ${PEN.mode!=='move'?'draw':''}" id="board">
      <canvas id="cv"></canvas>
      ${BOARD.chips.length || BOARD.strokes.length ? '' : '<div class="hintb">點選下方的關鍵字，它會出現在這裡。<br>拖曳移動、拉右下角藍點縮放；切換「畫筆」可用四色手繪標記。</div>'}
    </div>
    <div class="selbar" id="selbar"></div>
    <div class="kwlist" id="kwlist">${KEYWORDS.map(g => `<section class="kwg" style="--gc:var(--g-${g.c})"><h3><i></i>${esc(g.g)} <small>${g.items.length}</small></h3>
      <div class="kwgrid">${g.items.map(([k, d]) => `<button class="kwb ${onBoard.has(k)?'on':''}" data-kw="${esc(k)}" data-g="${g.c}" title="${esc(d)}">${esc(k)}</button>`).join('')}</div></section>`).join('')}</div>
  </div>`;
}
function setupBoard(){
  const board = $('#board'), cv = $('#cv'), ctx = cv.getContext('2d');
  BOARD.chips.forEach(c => board.appendChild(chipEl(c)));
  const size = () => { const r = board.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); layoutChips(); redraw(); };
  ro = new ResizeObserver(size); ro.observe(board); size();
  drawSel();
  // 工具列
  $('.tools').addEventListener('click', e => {
    const t = e.target.closest('button'); if(!t) return;
    if(t.dataset.tool === 'undo'){ if(BOARD.strokes.length){ BOARD.strokes.pop(); touchBoard(); redraw(); } else toast('沒有可復原的筆畫'); return; }
    if(t.dataset.tool === 'clear'){
      if(!clearArm){ clearArm = true; t.textContent = '再按一次確認清除'; setTimeout(() => { clearArm = false; if(t.isConnected) t.textContent = '清除畫布'; }, 2500); return; }
      clearArm = false; BOARD.chips = []; BOARD.strokes = []; sel = null; touchBoard(); render(); return;
    }
    if(t.dataset.tool) PEN.mode = t.dataset.tool;
    if(t.dataset.color){ PEN.color = t.dataset.color; if(PEN.mode !== 'pen') PEN.mode = 'pen'; }
    if(t.dataset.width){ PEN.width = +t.dataset.width; if(PEN.mode !== 'pen') PEN.mode = 'pen'; }
    $('.tools').querySelectorAll('[data-tool=move],[data-tool=pen],[data-tool=erase]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === PEN.mode));
    $('.tools').querySelectorAll('[data-color]').forEach(b => b.setAttribute('aria-pressed', b.dataset.color === PEN.color));
    $('.tools').querySelectorAll('[data-width]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.width === PEN.width));
    board.classList.toggle('draw', PEN.mode !== 'move');
  });
  // 關鍵字清單
  $('#kwlist').addEventListener('click', e => {
    const b = e.target.closest('.kwb'); if(!b) return;
    const k = b.dataset.kw, g = KEYWORDS.find(x => x.c === b.dataset.g), d = g.items.find(x => x[0] === k)[1];
    const n = BOARD.chips.length;
    const c = {id: 'k' + Date.now().toString(36) + n, k, d, g: g.c, x: .5 + ((n * 37) % 50 - 25) / 100, y: .45 + ((n * 23) % 40 - 20) / 100, s: 1};
    BOARD.chips.push(c); touchBoard();
    const hint = $('.hintb', board); if(hint) hint.remove();
    board.appendChild(chipEl(c)); layoutChips(); sel = c.id; markSel(); drawSel();
    b.classList.add('on');
    if(PEN.mode !== 'move') toast('已加入畫布；切換「移動」才能拖曳關鍵字');
  });
  // 畫筆
  let cur = null;
  const pt = e => { const r = board.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  cv.addEventListener('pointerdown', e => {
    if(PEN.mode === 'move') return;
    cv.setPointerCapture(e.pointerId);
    if(PEN.mode === 'pen'){ cur = {c: PEN.color, w: PEN.width, p: [pt(e)]}; BOARD.strokes.push(cur); }
    else { cur = {erase: true}; eraseAt(pt(e)); }
  });
  cv.addEventListener('pointermove', e => {
    if(!cur) return;
    if(cur.erase){ eraseAt(pt(e)); return; }
    const p = pt(e); cur.p.push([+p[0].toFixed(4), +p[1].toFixed(4)]); redraw();
  });
  const end = () => { if(cur){ cur = null; touchBoard(); redraw(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  function eraseAt(p){
    const r = board.getBoundingClientRect(), px = p[0] * r.width, py = p[1] * r.height;
    const before = BOARD.strokes.length;
    BOARD.strokes = BOARD.strokes.filter(s => !s.p.some((q, i) => { const a = s.p[i-1] || q; return segDist(px, py, a[0]*r.width, a[1]*r.height, q[0]*r.width, q[1]*r.height) < 10 + s.w; }));
    if(BOARD.strokes.length !== before) redraw();
  }
  function redraw(){
    const r = board.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    BOARD.strokes.forEach(s => { ctx.strokeStyle = penColor(s.c); ctx.lineWidth = s.w; ctx.beginPath(); s.p.forEach((q, i) => { const x = q[0]*r.width, y = q[1]*r.height; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); if(s.p.length === 1){ const x = s.p[0][0]*r.width, y = s.p[0][1]*r.height; ctx.lineTo(x + .1, y); } ctx.stroke(); });
  }
  board._redraw = redraw;
  board.addEventListener('pointerdown', e => { if(PEN.mode === 'move' && e.target === board){ sel = null; markSel(); drawSel(); } });
  // 選取列
  $('#selbar').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return; const c = BOARD.chips.find(x => x.id === sel); if(!c) return;
    if(b.dataset.z){ c.s = Math.max(.5, Math.min(4, +(c.s + (+b.dataset.z)).toFixed(2))); touchBoard(); layoutChips(); }
    else if(b.dataset.del !== undefined){ BOARD.chips = BOARD.chips.filter(x => x.id !== c.id); const el = board.querySelector(`[data-id="${c.id}"]`); if(el) el.remove(); sel = null; touchBoard(); drawSel(); syncOn(); }
    else if(b.dataset.ask !== undefined){ openDrawer('關鍵字：' + c.k, {key:'kw-' + c.k, context:`關鍵字：${c.k}\n簡述：${c.d}\n所屬主題：${KEYWORDS.find(g => g.c === c.g).g}\n畫布上其他關鍵字：${BOARD.chips.map(x => x.k).join('、')}`, chips:['詳細解釋這個關鍵字','它和畫布上其他關鍵字有什麼關係？','考試會怎麼考？','舉一個圖面上的例子']}); }
  });
}
function segDist(px, py, ax, ay, bx, by){ const dx = bx - ax, dy = by - ay, L = dx*dx + dy*dy; let t = L ? ((px-ax)*dx + (py-ay)*dy) / L : 0; t = Math.max(0, Math.min(1, t)); const x = ax + t*dx, y = ay + t*dy; return Math.hypot(px - x, py - y); }
function syncOn(){ const on = new Set(BOARD.chips.map(c => c.k)); document.querySelectorAll('.kwb').forEach(b => b.classList.toggle('on', on.has(b.dataset.kw))); }
function teardownBoard(){ if(ro){ ro.disconnect(); ro = null; } }
function chipEl(c){
  const el = document.createElement('div'); el.className = 'kchip'; el.dataset.id = c.id; el.style.setProperty('--gc', `var(--g-${c.g})`);
  el.innerHTML = `${esc(c.k)}<span class="hd" aria-label="縮放"></span>`;
  el.addEventListener('pointerdown', e => {
    if(PEN.mode !== 'move') return;
    e.preventDefault(); e.stopPropagation(); el.setPointerCapture(e.pointerId);
    sel = c.id; markSel(); drawSel();
    const board = $('#board'), r = board.getBoundingClientRect();
    const resize = e.target.classList.contains('hd');
    const sx = e.clientX, sy = e.clientY, ox = c.x, oy = c.y, os = c.s;
    const cx = r.left + c.x * r.width, cy = r.top + c.y * r.height, d0 = Math.hypot(sx - cx, sy - cy) || 1;
    el.style.cursor = 'grabbing';
    const mv = ev => {
      if(resize){ c.s = Math.max(.5, Math.min(4, os * Math.hypot(ev.clientX - cx, ev.clientY - cy) / d0)); }
      else { c.x = Math.max(.04, Math.min(.96, ox + (ev.clientX - sx) / r.width)); c.y = Math.max(.05, Math.min(.95, oy + (ev.clientY - sy) / r.height)); }
      place(el, c, r);
    };
    const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.style.cursor = ''; touchBoard(); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  el.addEventListener('wheel', e => { if(PEN.mode !== 'move') return; e.preventDefault(); c.s = Math.max(.5, Math.min(4, c.s * (e.deltaY < 0 ? 1.08 : 1/1.08))); place(el, c); clearTimeout(el._wt); el._wt = setTimeout(touchBoard, 400); }, {passive:false});
  return el;
}
function place(el, c, r){ r = r || $('#board').getBoundingClientRect(); el.style.transform = `translate(${c.x * r.width}px, ${c.y * r.height}px) translate(-50%, -50%) scale(${c.s})`; }
function layoutChips(){ const b = $('#board'); if(!b) return; const r = b.getBoundingClientRect(); BOARD.chips.forEach(c => { const el = b.querySelector(`[data-id="${c.id}"]`); if(el) place(el, c, r); }); }
function markSel(){ document.querySelectorAll('.kchip').forEach(el => el.classList.toggle('sel', el.dataset.id === sel)); }
function drawSel(){
  const bar = $('#selbar'); if(!bar) return; const c = BOARD.chips.find(x => x.id === sel);
  bar.innerHTML = c ? `<span class="def"><b>${esc(c.k)}</b>${esc(c.d)}</span><button class="btn" data-z="-0.2" aria-label="縮小">－</button><button class="btn" data-z="0.2" aria-label="放大">＋</button><button class="btn ai" data-ask>問 AI</button><button class="btn" data-del>移除</button>`
    : `<span class="def" style="color:var(--ink2)">${BOARD.chips.length ? '點選畫布上的關鍵字可查看說明、縮放、移除或問 AI。' : '畫布是空的：從下方清單點選關鍵字開始。'}</span>`;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { const b = $('#board'); if(b && b._redraw) b._redraw(); });

// ===== 啟動 =====
renderHeader(); render(); initSync(); getSample();
</script>
